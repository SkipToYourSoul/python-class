<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
  <title id="title">图灵测试：只用文字，判断谁是机器</title>
  <desc id="desc">左边是判断者，右边是隐藏身份的人和机器。判断者可以反复提问，阅读双方的文字回答，然后判断谁是机器。看不到外貌，听不到声音。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1457d9"/></marker></defs>
  <rect x="1" y="1" width="1078" height="398" rx="16" fill="#fffdf7" stroke="#071a3d" stroke-width="2"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#071a3d" text-anchor="middle">
    <rect x="32" y="76" width="220" height="232" rx="12" fill="#fff1bd" stroke="#071a3d" stroke-width="2"/>
    <g transform="translate(104 100) scale(3.2)" fill="none" stroke="#071a3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></g>
    <text x="142" y="219" font-size="30" font-weight="800">判断者</text>
    <text x="142" y="262" font-size="26">谁在和我聊天？</text>
    <text x="466" y="64" font-size="28" font-weight="800">只能用文字交流</text>
    <path d="M278 151H637" stroke="#1457d9" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="458" y="132" font-size="26">提问：你会怎么做？</text>
    <path d="M637 226H278" stroke="#1457d9" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="458" y="207" font-size="26">回答：我会……</text>
    <text x="460" y="280" font-size="26" font-weight="800" fill="#1457d9">可以继续追问 ↺</text>
    <rect x="672" y="24" width="376" height="296" rx="12" fill="#eaf0fb" stroke="#1457d9" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="860" y="65" font-size="28" font-weight="800">身份藏在屏幕后</text>
    <rect x="696" y="88" width="148" height="144" rx="8" fill="#fffdf7" stroke="#071a3d" stroke-width="2"/>
    <rect x="876" y="88" width="148" height="144" rx="8" fill="#fffdf7" stroke="#071a3d" stroke-width="2"/>
    <g transform="translate(741 100) scale(2.4)" fill="none" stroke="#071a3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></g>
    <g transform="translate(921 100) scale(2.4)" fill="none" stroke="#1457d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 12v4m20-4v4m-13-3v2m6-2v2"/></g>
    <text x="770" y="205" font-size="28" font-weight="800">人</text><text x="950" y="205" font-size="28" font-weight="800">机器</text>
    <text x="860" y="272" font-size="26">对外只显示 A、B 编号</text>
    <path d="M32 336H1048" stroke="#d0d8e5" stroke-width="2"/>
    <text x="540" y="378" font-size="28" font-weight="800">① 提问　→　② 阅读回答　→　③ 判断谁是机器</text>
  </g>
</svg>
